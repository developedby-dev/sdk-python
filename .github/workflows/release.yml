# 출시 — 공개 거울 developedby-dev/sdk-python (ADR-0050). 원천은 모노레포 sdks/python/.github/workflows/release.yml — 거울에서 고치지 않는다.
# 판 태그(v1.0.0)를 밀면 짓고 시험한 꾸러미를, 환경 release에서 대표가 승인한 뒤 PyPI 신뢰 게시(OIDC — PEP 740 증명은 자동)로 올린다.
# 손으로 돌리면(workflow_dispatch) 짓기 · 시험만 한다. 순서는 모노레포 docs/runbooks/sdk-release.md
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -q
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: 태그와 꾸러미 판이 같은지
        env:
          TAG: ${{ github.ref_name }}
        run: ls "dist/bydev-${TAG#v}-py3-none-any.whl" "dist/bydev-${TAG#v}.tar.gz"
      - name: 게시 (신뢰 게시 · 증명)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
